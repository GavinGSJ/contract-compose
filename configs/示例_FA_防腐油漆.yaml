# ===== FA 框架合同配置示例 =====
# 只需填写“变量”；其余条款按模板默认生成。所有内容均为示例，请替换。

买方主体: 启东惠生能源贸易有限公司     # 见 library/common/presets/买方主体.yaml

条件: [油漆包]                         # 非油漆包写 []：第9章仍保留，标注“不适用”

不适用: []                             # 需标注不适用的条款 ID，如 [PRI-06] 表示无履约保函（付款条款除外）

选项:                                  # 不填 = 用默认写法
  付款方式: 预付_到货                  # 见 library/common/options/付款方式.yaml：预付_到货 / 到货付清 / 预付_进度_到货 / 关键设备 / 自定义
  质保方式: 质保函                     # 质保函（到货款付款条件）或 质保金（预留）

输出文件名: 示例_FA_防腐油漆框架合同.docx

变量:
  # ---- 合同信息
  合同编号: F484-FA-EXAMPLE-001
  项目编号: F484
  项目名称: Example Project
  业主名称: Example Owner
  设施简称: FPSO
  设施全称: 浮式生产储卸油装置
  设施全称_en: floating production storage and offloading unit
  标的物名称: 防腐油漆
  标的物名称_en: Anti-corrosion Paint
  签订日期: 2026年10月  日
  签订日期_en: October  , 2026
  # ---- 卖方（示例）
  卖方.名称: 示例涂料有限公司
  卖方.英文名: Example Coatings Co., Ltd.
  卖方.地址: 示例地址
  卖方.电话: '021-00000000'
  # ---- 合同价款：只填含税总价，不含税价、税额、中英文大写自动计算
  币种: RMB                              # RMB / USD / EUR / GBP；外币默认不计增值税
  含税总价: 1130000
  # 增值税率: 13%                        # 不写 = 自动（人民币 13%，外币不涉及）；可写 9% / 6% / 0% / 不涉及增值税
  # ---- 技术协议
  有技术协议: 是                         # 否：1.1 及目录中附件五标注不适用
  技术协议号: EX-TA-001
  技术协议版本: Rev.0
  技术协议日期: '2026-09-30'
  # ---- 交货与付款
  交货期天数: 30
  预付款比例: 10
  到货款比例: 90
  质保比例: 5
  履约保函比例: 10
  # 未填写的必填项会在 Word 中以黄色“【待填：…】”标出
