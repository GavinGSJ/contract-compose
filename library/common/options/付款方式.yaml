# 付款方案：由哪些付款节点组成（节点见 payment_terms.yaml）。“适用”限定合同类型，不写则 FA、PO 都可用
名称: 付款方式
位置: FA 4.2 / PO 3.2
类型: 付款方案
默认: {FA: 预付_到货, PO: 简单合同}
说明: 付款节点及其单据见 payment_terms.yaml；质保函/质保金在“质保方式”中选择
选项:
  预付_到货:
    名称: 预付款（如需）+ 到货款（FA 模板原结构）
    适用: [FA]
    节点: [预付款, 到货款]
  到货付清:
    名称: 到货款一次付清
    适用: [FA]
    节点: [到货款]
  预付_进度_到货:
    名称: 预付款 + 进度款 + 到货款
    适用: [FA]
    节点: [预付款, 进度款, 到货款]
  关键设备:
    名称: 预付款 + 进度款 + 发货款 + 到货款 + 调试款（参考 PO 复杂合同，适用长周期/关键设备）
    适用: [FA]
    节点: [预付款, 进度款, 发货款_电汇, 到货款, 调试款]
  简单合同:
    名称: 到货款 + 质保款（PO 模板“非复杂合同”）
    适用: [PO]
    节点: [到货款, 质保款]
  预付_到货_质保:
    名称: 预付款 + 到货款 + 质保款
    适用: [PO]
    节点: [预付款, 到货款, 质保款]
  复杂合同:
    名称: 预付款 + 进度款 + 发货款 + 到货款 + 质保款 + 调试款（PO 模板“复杂合同”，适用长周期/关键设备）
    适用: [PO]
    节点: [预付款, 进度款, 发货款_电汇, 到货款, 质保款, 调试款]
  自定义:
    名称: 自定义（自选付款节点）
    节点: []
