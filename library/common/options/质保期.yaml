  库: 项目信息
  中文: 质保期
  英文: 质保期_en
  名称: 项目预设
选项:
  通用_18_48:
    名称: 通用（模板原文）
    中文: 质量保证期为项目验收合格后（18）个月或标的物交付买方验收合格后（48）个月，以先到者为准。
    英文: The Warranty period is (18) months after the provisional project acceptance or (48) months after BUYER’s acceptance of the GOODS upon delivery, whichever comes first.
  自定义:
    名称: 自定义（在下方填写中英文条款）
