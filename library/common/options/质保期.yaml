# 质量保证期写法。项目预设不在本文件维护，而是来自 library/common/presets/项目信息.yaml（按项目编号自动选用）
名称: 质量保证期
位置: QUA-04（3.4 b)）
类型: 句内
默认: 通用_18_48
说明: 按项目编号自动选用“预存库/项目信息”中的质保期条款（在表单“预存信息管理”中维护）；没有预设时用默认；也可选“自定义”
