# 预存信息库（可在表单“预存信息管理”页面中编辑）
名称: 项目信息
说明: 按项目代号预设的项目信息；合同表单填写“项目编号”后自动带出（项目名称、业主、设施、3.4 b) 质量保证期条款、PO 的附加附件）
条目名称标签: 项目代号（与合同表单中的“项目编号”一致，不区分大小写）
多行字段:
- 质保期
- 质保期_en
- 附加附件
字段:
  项目名称: 项目名称（英文）
  项目中文名: 项目名称（中文，不填用英文）
  业主名称: 业主（英文）
  业主中文名: 业主（中文，不填用英文）
  设施简称: 设施简称（如 FPSO）
  设施全称: 设施全称（中文）
  设施全称_en: 设施全称（英文）
  附加附件: PO 附件 L 之后的附加附件（每行一个：中文名 | 英文名）
  质保期: 质量保证期条款（中文）
  质保期_en: 质量保证期条款（英文）
