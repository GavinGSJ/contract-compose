# 合同类型设置。library/ 下有 type.yaml 的目录即为一种合同类型，程序与表单自动识别。
名称: FA 框架合同                     # 表单中显示的名称
说明: 框架合同；中文在前；章节从 1 起，条款 x.y，列项 a) / 1)
样式模板: templates/FA样式模板.docx    # 相对本目录
编号起始: 1                           # 第一章的章号
付款条款: [PRI-02]                    # 付款条款不做“不适用”标注（未选用的付款节点直接不出现）
履约保函条款: PRI-06                   # 表单“本合同需要履约保函”勾选项对应的条款；没有则写 null
表单标签: {}                          # 覆盖表单中变量的显示名（只对本类型生效）
