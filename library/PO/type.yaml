# 合同类型设置。library/ 下有 type.yaml 的目录即为一种合同类型，程序与表单自动识别。
名称: PO 实采合同                     # 表单中显示的名称
说明: 实采合同；英文在前；章节从 0 起（0. DEFINITIONS），条款 N.M，子条款 N.M.K，列项 a. / 1)
样式模板: templates/PO样式模板.docx    # 相对本目录
编号起始: 0                           # 第一章的章号
付款条款: [PAY-02]                    # 付款条款不做“不适用”标注（未选用的付款节点直接不出现）
履约保函条款: null                     # PO 没有履约保函条款
表单标签:                             # 覆盖表单中变量的显示名（只对本类型生效）
  质保比例: 质保款（%）
