# 付款方案：4.1 中未选用的付款节点保留并标注“（不适用）”，其比例写 N/A（“到货款+质保金”方案不出现预付款、调试款）；12.3 质量保函只在含调试款的方案中适用
名称: 付款方案
类型: 文字
位置: 4.1 付款节点、12.3 质量保函
说明: 到货款+质保金：S416 实采合同（默认）；预付款+到货款+调试款：设备类；到货款一次付清：钢材等材料类；预付款+到货款：无调试款
表单位置: 必填信息
默认: 到货款+质保金
选项:
  到货款+质保金:
    名称: 到货款 + 质保金
    中文: 到货款+质保金
    变量:
    - 到货款比例
    - 付款天数
    - 质保比例
    - 质保金_释放天数
    预设变量:
      预付款比例: N/A
      预付款_提前月数: N/A
      到货款比例: 95
      调试款比例: N/A
      调试款_支付月数: N/A
      质保比例: 5
    比例合计:
    - 到货款比例
    - 质保比例
  预付款+到货款+调试款:
    名称: 预付款 + 到货款 + 调试款
    中文: 预付款+到货款+调试款
    变量:
    - 预付款比例
    - 预付款_提前月数
    - 到货款比例
    - 付款天数
    - 调试款比例
    - 调试款_支付月数
    - 质保比例
    比例合计:
    - 预付款比例
    - 到货款比例
    - 调试款比例
  到货款一次付清:
    名称: 到货款一次付清
    中文: 到货款一次付清
    变量:
    - 到货款比例
    - 付款天数
    预设变量:
      预付款比例: N/A
      预付款_提前月数: N/A
      到货款比例: 100
      调试款比例: N/A
      调试款_支付月数: N/A
      质保比例: N/A
    比例合计:
    - 到货款比例
  预付款+到货款:
    名称: 预付款 + 到货款
    中文: 预付款+到货款
    变量:
    - 预付款比例
    - 预付款_提前月数
    - 到货款比例
    - 付款天数
    预设变量:
      到货款比例: 90
      调试款比例: N/A
      调试款_支付月数: N/A
      质保比例: N/A
    比例合计:
    - 预付款比例
    - 到货款比例
