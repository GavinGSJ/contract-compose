# 交货期方式：按最晚日期（母本）、按天数 / 周数 / 月数，或两者并写
名称: 交货期方式
类型: 文字
位置: 第三章 交货期
说明: 数量的单位在“交货期单位”中选（天 / 周 / 月 / 工作日）；起算点默认“收到中标通知书后”，可改
表单位置: 必填信息
默认: 最晚日期
选项:
  最晚日期:
    名称: 最晚交货日期
    中文: '{{交货日期}}'
    变量:
    - 交货日期
  天数:
    名称: 起算后 N 天（周、月）内
    中文: '{{交货期起算}}{{交货期数量}}{{选项:交货期单位}}内货到买方指定地点{{选项:交货期节假日}}'
    变量:
    - 交货期起算
    - 交货期数量
    - 交货期单位
    - 交货期节假日
  天数+最晚日期:
    名称: 起算后 N 天（周、月）内，且最晚日期
    中文: '{{交货期起算}}{{交货期数量}}{{选项:交货期单位}}内货到现场{{选项:交货期节假日}}，最晚不迟于{{交货日期}}货到买方指定地点'
    变量:
    - 交货期起算
    - 交货期数量
    - 交货期单位
    - 交货期节假日
    - 交货日期
  安排发货+最晚日期:
    名称: 起算后安排发货，且最晚日期
    中文: '{{交货期起算}}安排发货，最晚不迟于{{交货日期}}货到买方指定地点'
    变量:
    - 交货期起算
    - 交货日期
