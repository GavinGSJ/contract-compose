# 合同类型设置。library/ 下有 type.yaml 的目录即为一种合同类型，程序与表单自动识别。
名称: S416 VLCC 采购订单                # 表单中显示的名称
说明: 中文；章号“一、”，条款 x.y；同一模板适用材料类与设备类物资（“物资类别”切换）
样式模板: templates/S416样式模板.docx
编号起始: 1
付款条款: []
履约保函条款: null
不适用标注: （不适用）                   # 中文合同只标中文
货物明细: true                          # 价格表按多行货物生成，含税总价 = 各行总金额之和
附件编号: 仅提供的                        # 只给“有”的附件依次编号（没有编号的附件在引用处写 N/A）
货物旁变量: [计价单位]                    # 表单中放在货物明细旁边填写的变量
表单标签:                              # 表单中变量的显示名
  预付款比例: 预付款（%）
  到货款比例: 到货款（%）
  调试款比例: 调试款（%）
  质保比例: 质量保函（%）
  预付款_提前月数: 预付款：交货期前几个月内支付（中文数字）
  调试款_支付月数: 调试款：收到质量保函后几个月支付（中文数字）
  交货期起算: 交货期起算点
  交货日期: 最晚交货日期（如 2026年11月25日）
  交货期数量: 交货期数量
  计价单位: 单价的计价单位（元/××）
表单隐藏: [项目编号, 项目名称, 业主名称, 设施简称, 设施全称, 标的物名称, 币种, 技术协议, 付款方式, 质保方式, 质保期]
