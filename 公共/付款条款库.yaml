# ============================================================
# 付款条款库（FA、PO 共用）：付款节点 + 付款单据（触发条件）
# 来源：FA 模板 4.2；F520 PO 模板 3.2（rev04）
#
# 结构：
#   - 排版：FA 为 4.2 下的 a) b)（单据 1) 2)）；PO 为 3.2.1 子条款（单据 a. b.）
#   - 顺序 / 顺序_质保金：各类型节点的输出顺序（PO 无质保函时“质保款”移到最后）
#   - 节点：公共字段（名称、比例变量）+ 各类型的 标题/正文/单据（FA:、PO: 下）；
#           没有某类型写法的节点不在该类型中出现（如“质保金”仅 FA，“质保款”仅 PO）
#   - 单据：两类型共用的单据直接写；PO 专用的以 PO_ 开头
#
# 规则：
#   - 付款方案在 选项库/付款方式.yaml 中选择；质保担保方式在 选项库/质保方式.yaml 中选择：
#       FA 质保函：到货款单据中加入“质量保证函”（每批次订单总价的 {{质保比例}}%）
#       FA 质保金：到货款时预留 {{质保比例}}% 作为质量保证金，质保期满后释放（自动追加“质量保证金”节点）
#       PO 质保函：“质保款”凭质保函和完工文件在 {{付款天数}} 天内支付
#       PO 质保金：“质保款”改为质保期满后支付并移到最后，完工文件移至调试款（无调试款时留在质保款）
#   - 单据写“可选: true”的，仅在合同配置“付款可选单据”中列出时才出现
#   - 单据写“无节点: X”的，方案中含节点 X 时不出现（如已有预付款，到货款不再要求签字合同）
#   - 单据写“质保方式: X”的，仅在该质保方式下出现
#   - {{本节点比例}} 替换为所在节点的比例（如发票金额）
#   - FA 中所有付款节点均按“每批次订单总价”计；PO 按“合同总价”计
# ============================================================
排版:
  FA: 列项
  PO: 子条款
顺序:
  FA:
  - 预付款
  - 进度款
  - 发货款_电汇
  - 发货款_信用证
  - 到货款
  - 调试款
  - 质保金
  PO:
  - 预付款
  - 进度款
  - 发货款_电汇
  - 发货款_信用证
  - 到货款
  - 质保款
  - 调试款
顺序_质保金:
  PO:
  - 预付款
  - 进度款
  - 发货款_电汇
  - 发货款_信用证
  - 到货款
  - 调试款
  - 质保款
质保金模式追加:
  FA: 质保金
节点:
  预付款:
    名称: 预付款
    比例变量: 预付款比例
    FA:
      标题: 预付款（如需）Advance payment (if any)
      正文:
      - 每批次订单生效后，买方在收到卖方以下（{{预付款_文件数}}）文件后，在（{{预付款_天数}}）日历日内，向卖方支付该批次订单总价的{{预付款比例}}%作为预付款。After each Purchase Order takes effect, the BUYER shall, within ({{预付款_天数}}) calendar days after receiving the following documents from the SELLER, make a prepayment of {{预付款比例}}% of the total price of such Purchase Order to the SELLER.
      单据:
      - 发票_同额
      - 生产进度计划
      - 预付款保函
      - 技术文件提交
    PO:
      标题: The advance payment 预付款
      正文:
      - '{{预付款比例}}% of TOTAL CONTRACT PRICE shall be paid by BUYER to SELLER by T/T within {{英文数字:付款天数}} ({{付款天数}}) days after the BUYER has received the following documents: 合同总价的{{预付款比例}}%，买方收到下列文件后{{付款天数}}天内通过电汇的方式支付卖方：'
      单据:
      - 签字合同
      - PO_商业发票三份
      - PO_ITP进度计划
      - PO_预付款保函
  进度款:
    名称: 进度款（主材到厂）
    来源: PO 3.2.2
    比例变量: 进度款比例
    FA:
      标题: 进度款 Progress payment
      正文:
      - 每批次订单总价的{{进度款比例}}%作为进度款，应由买方在收到下列文件的{{付款天数}}日内通过电汇方式向卖方支付：
      - '{{进度款比例}}% of the total price of each Purchase Order shall be paid as the progress payment by BUYER to SELLER by T/T within ({{付款天数}}) days after the BUYER has received the following documents:'
      单据:
      - 发票_同额
      - 主材到厂
      - 技术文件提交
    PO:
      标题: The progress payment 进度款
      正文:
      - '{{进度款比例}}% of the TOTAL CONTRACT PRICE shall be paid as the progress payment by BUYER to SELLER by T/T within {{英文数字:付款天数}} ({{付款天数}}) days after the BUYER has received the following documents: 买方收到下列文件后{{付款天数}}天内通过电汇的方式支付合同总价的{{进度款比例}}%作为进度款给卖方：'
      单据:
      - PO_商业发票三份
      - PO_主材到厂
      - PO_技术文件提交
  发货款_电汇:
    名称: 发货款（电汇，发货前付）
    来源: PO 3.2.3 Option 1
    比例变量: 发货款比例
    FA:
      标题: 发货款 Payment for shipping
      正文:
      - 每批次订单总价的{{发货款比例}}%应在发货前由买方以电汇方式支付给卖方。卖方应在每次发运后两（2）天内将下列文件快递给买方：
      - '{{发货款比例}}% of the total price of each Purchase Order shall be paid by the BUYER to the SELLER by T/T prior to shipment, and the SELLER shall send the following documents to the BUYER through international courier service within two (2) days after each shipment is made:'
      单据:
      - 发运单据
    PO:
      标题: The payment for shipping 发货款
      正文:
      - '{{发货款比例}}% of the TOTAL CONTRACT PRICE shall be paid by the BUYER to the SELLER by T/T prior to shipment and the following documents shall be sent to BUYER by SELLER through international courier service within two (2) days after each shipment is made.'
      - 相当于合同总价的{{发货款比例}}%的货款应在发货前由买方以电汇方式支付给卖方。卖方应在每次发运后两（2）天内将下列文件快递给买方：
      单据:
      - PO_发运单据_电汇
  发货款_信用证:
    名称: 发货款（不可撤销信用证）
    来源: PO 3.2.3 Option 2
    比例变量: 发货款比例
    FA:
      标题: 发货款 Payment for shipping
      正文:
      - 每批次订单总价的{{发货款比例}}%应由买方以不可撤销信用证方式支付给卖方。买方在收到卖方开证要求后，应在装运前{{信用证_开证提前天数}}天通过买方银行开出信用证，信用证有效期至最迟装运日期以后21天。卖方应在装运后7天内通过其银行向买方银行提交下列单据进行交单议付：
      - '{{发货款比例}}% of the total price of each Purchase Order shall be paid by the BUYER to the SELLER by an irrevocable letter of credit (L/C). The L/C will be issued {{信用证_开证提前天数}} days before the date of shipment through the BUYER’s bank, upon receipt from the SELLER of the L/C opening request, and shall be valid until twenty-one (21) days after the last shipment date. The SELLER shall present the following documents through its bank to the BUYER’s bank for negotiation within seven (7) days after the shipment:'
      单据:
      - 发运单据
    PO:
      标题: The payment for shipping 发货款
      正文:
      - '{{发货款比例}}% of the TOTAL CONTRACT PRICE shall be paid by the BUYER to the SELLER by an irrevocable letter of credit (L/C). The L/C will be issued {{信用证_开证提前天数}} days before the date of shipment through the BUYER’s bank, upon receipt from the SELLER of the L/C opening request. The L/C shall be valid until twenty-one (21) days after the last shipment date.'
      - 相当于合同总价的{{发货款比例}}%的货款应由买方以不可撤销信用证方式支付给卖方。买方在收到卖方开证要求后，应在装运前{{信用证_开证提前天数}}天，通过买方银行开出信用证。信用证有效期至最迟装运日期以后21天。
      - The SELLER shall present the following documents through his bank to the BUYER’s bank for negotiation within seven (7) days after the shipment.
      - 卖方应在装运后7天内通过其银行向买方银行提交下列单据进行交单议付。
      单据:
      - PO_发运单据_信用证
  到货款:
    名称: 到货款（每批订单到货验收后）
    比例变量: 到货款比例
    FA:
      标题: 到货款 Payment Upon delivery
      正文:
      - 卖方应根据买方下发的订单提供货物，每批次订单总价的{{到货款比例}}%应由买方在合同货物到货验收后且收到下列文件的{{付款天数}}日内通过电汇方式向卖方支付：
      - 'SELLER shall provide the GOODS in accordance with the specific purchase order, {{到货款比例}}% of purchase order shall be paid by BUYER to SELLER by T/T within ({{付款天数}}) days after the complete delivery of the CONTRACT GOODS and BUYER has received the following documents: '
      单据:
      - 单据: 签字合同
        无节点: 预付款
      - 发票_全额
      - 验收证明
      - 单据: 质保函
        质保方式: 质保函
    PO:
      标题: Payment Upon delivery 到货款
      正文:
      - '{{到货款比例}}% of TOTAL CONTRACT PRICE shall be paid by BUYER to SELLER by T/T within {{英文数字:付款天数}} ({{付款天数}}) days after the complete delivery of the CONTRACT GOODS and BUYER has received the following documents:'
      - 合同总价的{{到货款比例}}%应由买方在合同货物交付完成后且收到下列文件的{{付款天数}}日内通过电汇方式向卖方支付：
      单据:
      - 单据: 签字合同
        无节点: 预付款
      - PO_发票_到货
      - PO_交付确认
      - 验收证明
  质保款:
    名称: 质保款（凭质保函支付；无质保函时质保期满后支付）
    比例变量: 质保比例
    PO:
      标题: Payment for warranty 质保款
      正文:
      - '{{质保比例}}% of the TOTAL CONTRACT PRICE shall be paid by the BUYER to the SELLER by T/T within {{英文数字:付款天数}} ({{付款天数}}) days after the BUYER has received the following documents:'
      - 合同总价的{{质保比例}}%应由买方在收到下列文件的{{付款天数}}日内通过电汇方式向卖方支付：
      正文_质保金:
      - '{{质保比例}}% of the TOTAL CONTRACT PRICE shall be paid by the BUYER to the SELLER by T/T within {{英文数字:付款天数}} ({{付款天数}}) days after the expiry of the warranty period of this CONTRACT and the BUYER has received the following documents:'
      - 合同总价的{{质保比例}}%应由买方在本合同质保期届满后且收到下列文件的{{付款天数}}日内通过电汇方式向卖方支付：
      单据:
      - PO_商业发票_质保
      - 单据: PO_质保函
        质保方式: 质保函
      - 单据: PO_完工文件
        质保方式: 质保函
      - 单据: PO_完工文件
        质保方式: 质保金
        无节点: 调试款
  调试款:
    名称: 调试款（现场调试完成后）
    来源: PO 3.2.6
    比例变量: 调试款比例
    FA:
      标题: 调试款 Payment of Commissioning
      正文:
      - 每批次订单总价的{{调试款比例}}%应由买方在现场调试成功完成后且收到下列文件的{{付款天数}}日内通过电汇方式向卖方支付：
      - '{{调试款比例}}% of the total price of each Purchase Order shall be paid by BUYER to SELLER by T/T within ({{付款天数}}) days after the completion of successful site commissioning and BUYER has received the following documents:'
      单据:
      - 发票_同额
      - 验收证明
    PO:
      标题: Payment of Commissioning 调试款
      正文:
      - '{{调试款比例}}% of TOTAL CONTRACT PRICE shall be paid by BUYER to SELLER by T/T within {{英文数字:付款天数}} ({{付款天数}}) days after the completion of successful site commissioning and BUYER has received the following documents:'
      - 合同总价的{{调试款比例}}%应由买方在现场调试成功完成后且收到下列文件的{{付款天数}}日内通过电汇方式向卖方支付：
      单据:
      - PO_商业发票三份
      - 验收证明
      - 单据: PO_完工文件
        质保方式: 质保金
  质保金:
    名称: 质量保证金（预留，质保期满释放）
    比例变量: 质保比例
    仅当质保方式: 质保金
    FA:
      标题: 质量保证金 Quality guarantee deposit
      正文:
      - 质量保证金为每批次订单总价的{{质保比例}}%，在该批次到货款中预留。标的物质量保证期满且无质量或遗留问题，卖方向买方提交释放质保金申请函，买方确认并无异议后（{{质保金_释放天数}}）个日历日内向卖方无息付清质量保证金。The quality guarantee deposit is {{质保比例}}% of the total price of each Purchase Order, which shall be retained from the payment upon delivery of such Purchase Order. If the quality guarantee period of the GOODS expires and there are no quality or remaining problems, the SELLER shall submit an application letter for the release of the quality guarantee deposit to the BUYER. After the BUYER confirms that there are no objections, the quality guarantee deposit shall be paid in full to the SELLER without interest within ({{质保金_释放天数}}) calendar days.
      单据: []
单据:
  签字合同: CONTRACT duly signed by PARTIES without reservation 双方不带保留项的签字合同；
  发票_同额: 同额度增值税专用发票 ; VAT special invoice with the same amount
  发票_全额: Correct original copy of 100% of VAT invoice shall be provided by SELLER in mainland China or 100% commercial invoice shall be provided by SELLER outside mainland China 在中国大陆境内的卖方需提供正确的100%增值税发票原件或中国大陆境外卖方需提供100%商业发票；
  验收证明: One (1) original and one (1) copy of the Acceptance Certificate signed by BUYER and SELLER; 买卖双方共同签署验收证明原件、复印件各一份；
  生产进度计划: 生产进度计划Production schedule；
  预付款保函: 预付款保函/履约保函 （如有）Advance payment guarantee/performance guarantee (if any)；
  技术文件提交: 完成下列技术文件的提交（按要求调整）The complete submission of the following technical documents (If any)
  主材到厂: 主要材料（或主要构件）（{{进度款_主材名称}}）到厂验证报告；The certification of main material or main component ({{进度款_主材名称}}) arriving to the factory;
  质保函: 质量保证函 Warranty Bond：由卖方银行出具或由买方银行通知的、以买方为受益人的不可撤销且无条件见索即付的保函，金额为每批次订单总价{{质保比例}}%的银行保函作为卖方在合同货物质保期内卖方义务的担保，保函的有效期至质保期结束后45天。保函样本见附件B An irrevocable and unconditional Bank Letter of Guarantee covering {{质保比例}}% of the total price of each Purchase Order, issued by SELLER’s bank or advised by BUYER’s bank in favor of BUYER as a security of SELLER’s liabilities within the quality guarantee period of the CONTRACT GOODS, valid until forty-five (45) days after the quality guarantee period expires. The specimen is as per ATTACHMENT B.
  发运单据:
    组:
    - 提单_长途海运
    - 提单_短途海运
    - 空运单
    - 商业发票_发运
    - 装箱单
    - 重量数量证明
    - 原产地证明
    - 木质包装声明
    - 质量证书
    - 检验报告
    - 保险单
    - 原材料质量证明
    - 原材料原产地证明
  提单_长途海运: '在长时间海运情况下：全套正本已装船清洁海运提单，标明“运费到付（FOB情况下）”/“运费已付（CIF或者CFR情况下）”、合同号、唛头，空白抬头并空白背书，并注明通知人为买方且注明买方的完整地址及联系电话；In case of long-time sea-freight: Full set of original “clean on board” ocean Bill of Lading, marked "Freight to be collected (FOB)"/"Freight Prepaid (CIF and CFR)", Contract No. and shipping mark, made out to order and blank endorsed, notifying the BUYER with typing its complete address and telephone number;'
  提单_短途海运: '在短时间海运情况下，例如通过香港、日本、韩国或东南亚运输的情况下：电放已装船清洁海运提单，标明“运费到付（FOB情况下）”/“运费已付（CIF或者CFR情况下）”、合同号、唛头，空白抬头并空白背书，并注明通知人为买方且注明买方的完整地址及联系电话；In case of short time sea-freight, such as shipment from Hong Kong, Japan, Korea or South-East Asia etc.: telex release “clean on board” ocean Bill of Lading, marked "Freight to be collected (FOB)"/"Freight Prepaid (CIF and CFR)", Contract No. and shipping mark, made out to order and blank endorsed, notifying the BUYER with typing its complete address and telephone number;'
  空运单: '在空运情况下：一份正本、一份复本空运单，注明“运费到付（FCA情况下）”/“运费已付（CIP或者CPT情况下）”、合同号、唛头，并注明收货人为买方；In case of air-freight: One original and one copy of airway bill marked "Freight to be collected (FCA)"/"Freight Prepaid (CIP & CPT)", Contract No. and shipping marks and consigned to the BUYER;'
  商业发票_发运: 正本商业发票六份，标明合同号、信用证号（如有）、货物名称，注明发运货物的总金额；Six (6) originals of commercial invoice indicating the Contract number, L/C No. (if any), names of the commodities, total value of the shipped commodities;
  装箱单: 卖方出具的正本装箱单六份，注明货物名称，编号，数量，毛、净重，每件尺寸，是否有木制包装及其他重要包装信息；Packing List in six (6) originals issued by SELLER indicating name of Goods, item No., quantity, gross and net weights, measurement of each package, if woods are used for packing, and other important packing information;
  重量数量证明: 制造商出具的重量数量证明原件一份，复印件一份；One (1) original and one (1) copy of weight and quantity certificate issued by the manufacturer;
  原产地证明: 制造商所在国授权机构出具的货物原产地证明正本一份，副本二份；Certificate of Origin in one (1) original and two (2) copies issued by the authorities of manufacturer’s country;
  木质包装声明: 卖方出具的木质包装声明原件一份，保证所有木质包装印IPPC标志，并已按ISPM 15的有关规定对木质包装进行过熏蒸处理；或者非木质包装声明原件一份；One original of SELLER’s declaration for wood package stating that all wood packages are stamped IPPC mark and in compliance with ISPM 15 regulation, or one original statement of non-wooden materials packing issued by SELLER;
  质量证书: 卖方出具的质量证书原件一份，复印件一份；One (1) original and one (1) copy of Certificate of Quality issued by the SELLER;
  检验报告:
    可选: true
    正文: 制造商出具的检验报告或工厂测试报告正本六份，应注明详细、明确的测试结果；Inspection Report or Mill Test Report in six (6) originals issued by the Manufacturer indicating detailed and definite inspection results;
  保险单: '在CIF或者CIP情况下：保险单或者保险证明正本一份、复本两份，保额为发运货物总金额的110%，投保一切险及战争险，受益人为买方，赔付地为中国；In case of CIF/CIP Terms: Insurance Policy or Certificate in one original and two copies covering 110% value of Goods shipped against All RISKS and WAR RISK, in favor of the BUYER and showing claims payable at China;'
  原材料质量证明:
    可选: true
    正文: 原材料制造商出具的原材料质量证明复印件一份；One copy of certificate of quality issued by the Raw Material Manufacturer;
  原材料原产地证明:
    可选: true
    正文: 原材料制造商所在国授权机构出具的货物原产地证明副本一份。Certificate of Origin in one (1) copy issued by the authorities of the Raw Material Manufacturer’s country.
  PO_商业发票三份: Three (3) originals of signed commercial invoice issued by SELLER covering {{本节点比例}}% of the TOTAL CONTRACT PRICE; 卖方出具的金额相当于合同总价{{本节点比例}}%的正本商业发票三份；
  PO_ITP进度计划: The ITP and Progress Schedule 检验、试验计划（ITP）和生产进度计划；
  PO_预付款保函: An irrevocable and unconditional Bank Letter of Guarantee issued by SELLER in accordance with the template available in the CONTRACT, from a bank approved by BUYER within thirty (30) days after the CONTRACT becomes effective in favor of the BUYER covering {{预付款比例}}% of the TOTAL CONTRACT PRICE. This guarantee shall be valid until thirty (30) days after the DELIVERY DATE. The specimen is as per ATTACHMENT J. 卖方应在合同生效后30天之内，由卖方根据附件J中提供的模板，从买方认可的银行开具不可撤销及无条件见索即付银行保函，保函金额为合同总价的{{预付款比例}}%，保函有效期应至货物交付后（30）天。
  PO_主材到厂: The certification of main material or main component ({{进度款_主材名称}}) arriving to the factory. 主要材料（或主要构件）（{{进度款_主材名称}}）到厂验证报告。
  PO_技术文件提交:
    正文: The complete submission of the following technical documents 完成下列技术文件的提交：
    表格: PO-PAY-T1
  PO_发票_到货: Correct original copy of 100% of VAT invoice shall be provided by SELLER in mainland China or {{本节点比例}}% commercial invoice shall be provided by SELLER outside mainland China 在中国大陆境内的卖方需提供正确的100%增值税发票原件或中国大陆境外卖方需提供{{本节点比例}}%商业发票；
  PO_交付确认: Written confirmation from BUYER on the delivery completion 买方出具货物交付完成的书面确认；
  PO_商业发票_质保: Commercial invoice covering {{本节点比例}}% of the TOTAL CONTRACT PRICE issued by SELLER; 卖方出具的金额为合同总价{{本节点比例}}%的正本商业发票；
  PO_质保函: An irrevocable and unconditional Bank Letter of Guarantee covering {{质保比例}}% of TOTAL CONTRACT PRICE, issued by SELLER’s bank or advised by BUYER’s bank in favor of BUYER as a security of SELLER’s liabilities within the quality guarantee period of the CONTRACT GOODS, valid until forty-five (45) days after the quality guarantee period expires. The specimen is as per ATTACHMENT J. 由卖方银行出具或由买方银行通知的、以买方为受益人的不可撤销且无条件见索即付的保函，金额为合同总价{{质保比例}}%的银行保函作为卖方在合同货物质保期内卖方义务的担保，保函的有效期至质保期结束后45天。保函样本见附件J。
  PO_完工文件: BUYER’s written confirmation that {{完工文件_原件份数}} original(s) and {{完工文件_电子份数}} electronic copies of the final approved as-built documents have been delivered successfully. 买方书面确认审批通过的完工文件原件{{完工文件_原件份数}}份、电子版{{完工文件_电子份数}}份已交付完成。
  PO_发运单据_电汇:
    组:
    - PO_提单_电汇
    - PO_商业发票_发运
    - PO_装箱单
    - PO_重量数量证明
    - PO_原产地证明
    - PO_木质包装声明
    - PO_质量证书
    - PO_检验报告
    - PO_保险单
    - PO_原材料质量证明
    - PO_原材料原产地证明
  PO_发运单据_信用证:
    组:
    - PO_提单_信用证
    - PO_商业发票_发运
    - PO_装箱单
    - PO_重量数量证明
    - PO_原产地证明
    - PO_木质包装声明
    - PO_质量证书
    - PO_检验报告_可选
    - PO_保险单
    - PO_原材料质量证明
    - PO_原材料原产地证明
  PO_提单_电汇:
    正文:
    - Bill of Lading/Airway Bill 海运提单/空运单
    - Full set of original “clean on board” ocean Bill of Lading, marked "Freight to be collected (FOB)"/"Freight Prepaid (CIF and CIP)", Contract No. and shipping mark, made out to order and blank endorsed, notifying the BUYER with typing its complete address and telephone number.
    - 全套正本已装船清洁海运提单，标明“运费到付（FOB情况下）”/“运费已付（CIF或者CIP情况下）”、合同号、唛头，空白抬头并空白背书，并注明通知人为买方且注明买方的完整地址及联系电话；
  PO_提单_信用证:
    正文: Bill of Lading/Airway Bill 海运提单/空运单
    子项:
    - PO_提单_长途海运
    - PO_提单_短途海运
    - PO_空运单
  PO_提单_长途海运:
    正文:
    - 'In case of long-time sea-freight: Full set of original “clean on board” ocean Bill of Lading, marked "Freight to be collected (FOB)"/"Freight Prepaid (CIF and CFR)", Contract No. and shipping mark, made out to order and blank endorsed, notifying the BUYER with typing its complete address and telephone number.'
    - 在长时间海运情况下：全套正本已装船清洁海运提单，标明“运费到付（FOB情况下）”/“运费已付（CIF或者CFR情况下）”、合同号、唛头，空白抬头并空白背书，并注明通知人为买方且注明买方的完整地址及联系电话；
  PO_提单_短途海运:
    正文:
    - 'In case of short time sea-freight, such as shipment from Hong Kong, Japan, Korea or South-East Asia etc.: telex release “clean on board” ocean Bill of Lading, marked "Freight to be collected (FOB)"/"Freight Prepaid (CIF and CFR)", Contract No. and shipping mark, made out to order and blank endorsed, notifying the BUYER with typing its complete address and telephone number.'
    - 在短时间海运情况下，例如通过香港、日本、韩国或东南亚运输的情况下：电放已装船清洁海运提单，标明“运费到付（FOB情况下）”/“运费已付（CIF或者CFR情况下）”、合同号、唛头，空白抬头并空白背书，并注明通知人为买方且注明买方的完整地址及联系电话；
  PO_空运单:
    正文:
    - 'In case of air-freight: One original and one copy of airway bill marked "Freight to be collected (FCA)"/"Freight Prepaid (CIP & CPT)", Contract No. and shipping marks and consigned to the BUYER.'
    - 在空运情况下：一份正本、一份复本空运单，注明“运费到付（FCA情况下）”/“运费已付（CIP或者CPT情况下）”、合同号、唛头，并注明收货人为买方。
  PO_商业发票_发运:
    正文:
    - Six (6) originals of commercial invoice indicating the Contract number, L/C No. (if any), names of the commodities, total value of the shipped commodities;
    - 正本商业发票六份，标明合同号、信用证号（如有）、货物名称，注明发运货物的总金额；
  PO_装箱单:
    正文:
    - Packing List in six (6) originals issued by SELLER indicating name of Goods, item No., quantity, gross and net weights, measurement of each package, if woods are used for packing, and other important packing information;
    - 卖方出具的正本装箱单六份，注明货物名称，编号，数量，毛、净重，每件尺寸，是否有木制包装及其他重要包装信息；
  PO_重量数量证明:
    正文:
    - One (1) original and one (1) copy of weight and quantity certificate issued by the manufacturer;
    - 制造商出具的重量数量证明原件一份，复印件一份；
  PO_原产地证明:
    正文:
    - Certificate of Origin in one (1) original and two (2) copies issued by the authorities of manufacturer’s country;
    - 制造商所在国授权机构出具的货物原产地证明正本一份，副本二份；
  PO_木质包装声明:
    正文:
    - One original of SELLER’s declaration for wood package stating that all wood packages are stamped IPPC mark and in compliance with ISPM 15 regulation, or one original statement of non-wooden materials packing issued by SELLER;
    - 卖方出具的木质包装声明原件一份，保证所有木质包装印IPPC标志，并已按ISPM 15的有关规定对木质包装进行过熏蒸处理；或者非木质包装声明原件一份；
  PO_质量证书:
    正文:
    - One (1) original and one (1) copy of Certificate of Quality issued by the SELLER;
    - 卖方出具的质量证书原件一份，复印件一份；
  PO_检验报告:
    正文:
    - Inspection Report or Mill Test Report in six (6) originals issued by the Manufacturer indicating detailed and definite inspection results;
    - 制造商出具的检验报告或工厂测试报告正本六份，应注明详细、明确的测试结果；
  PO_检验报告_可选:
    可选: true
    正文:
    - Inspection Report or Mill Test Report in six (6) originals issued by the Manufacturer indicating detailed and definite inspection results;
    - 制造商出具的检验报告或工厂测试报告正本六份，应注明详细、明确的测试结果；
  PO_保险单:
    正文:
    - 'In case of CIF/CIP Terms: Insurance Policy or Certificate in one original and two copies covering 110% value of goods shipped against All RISKS and WAR RISK, in favor of the BUYER and showing claims payable at China.'
    - 在CIF或者CIP情况下：保险单或者保险证明正本一份、复本两份，保额为发运货物总金额的110%，投保一切险及战争险，受益人为买方，赔付地为中国。
  PO_原材料质量证明:
    可选: true
    正文:
    - One copy of certificate of quality issued by the Raw Material Manufacturer;
    - 原材料制造商出具的原材料质量证明复印件一份；
  PO_原材料原产地证明:
    可选: true
    正文:
    - Certificate of Origin in one (1) copy issued by the authorities of the Raw Material Manufacturer’s country.
    - 原材料制造商所在国授权机构出具的货物原产地证明副本一份。
